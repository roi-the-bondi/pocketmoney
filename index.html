<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>בנק המשפחה - קופת חיסכון</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body {
        margin: 0;
        background-color: #020617;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
      import React, { useState, useEffect, useRef } from 'https://esm.sh/react@18.2.0';
      import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
      import {
        Wallet,
        TrendingUp,
        Heart,
        ShieldCheck,
        Coins,
        Plus,
        Minus,
        ArrowUpRight,
        Lock,
        Unlock,
        Calendar,
        History,
        X,
        Check,
        RotateCcw,
        FastForward,
        User,
        Users,
        Cloud,
        CloudOff
      } from 'https://esm.sh/lucide-react@0.344.0';
      import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js';
      import {
        getFirestore,
        doc,
        onSnapshot,
        setDoc
      } from 'https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js';
      import {
        getAuth,
        signInAnonymously,
        onAuthStateChanged
      } from 'https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js';

      const MY_CUSTOM_FIREBASE_CONFIG = {
        apiKey: "AIzaSyCidsufAj_YTodxVumZq7V1GKmpfMhysZ0",
        authDomain: "pocket-money-f9e07.firebaseapp.com",
        projectId: "pocket-money-f9e07",
        storageBucket: "pocket-money-f9e07.firebasestorage.app",
        messagingSenderId: "293671775732",
        appId: "1:293671775732:web:336a9aae201c3c3240dda1",
        measurementId: "G-RC3W1X1V51"
      };

      let db = null;
      let auth = null;
      try {
        const app = getApps().length === 0 ? initializeApp(MY_CUSTOM_FIREBASE_CONFIG) : getApps()[0];
        db = getFirestore(app);
        auth = getAuth(app);
      } catch (err) {
        console.warn('Cloud sync running in local-fallback mode:', err);
      }

      const APP_ID = 'family-pocket-money';
      const FAMILY_ID_STORAGE_KEY = 'family_pocket_money_sync_code';
      const STORAGE_KEY = 'family_pocket_money_v1';

      const INITIAL_DATA = {
        activeChildId: 'aviv',
        parentPin: '1234',
        children: {
          aviv: {
            name: 'אביב',
            bucket: { baseAmount: 25, currentAmount: 25, adjustments: [] },
            funds: {
              available: { balance: 0 },
              savings: { principal: 0, interest: 0, unlockDate: Date.now() + 90 * 24 * 60 * 60 * 1000 },
              donation: { balance: 0, unlockDate: Date.now() + 90 * 24 * 60 * 60 * 1000 }
            },
            history: []
          },
          shaked: {
            name: 'שקד',
            bucket: { baseAmount: 25, currentAmount: 25, adjustments: [] },
            funds: {
              available: { balance: 0 },
              savings: { principal: 0, interest: 0, unlockDate: Date.now() + 90 * 24 * 60 * 60 * 1000 },
              donation: { balance: 0, unlockDate: Date.now() + 90 * 24 * 60 * 60 * 1000 }
            },
            history: []
          }
        }
      };

      function App() {
        const [familyCode, setFamilyCode] = useState(() => localStorage.getItem(FAMILY_ID_STORAGE_KEY) || 'family-aviv-shaked');
        const [cloudConnected, setCloudConnected] = useState(false);
        const [showSyncModal, setShowSyncModal] = useState(false);
        const [syncInput, setSyncInput] = useState('');
        const isRemoteUpdateRef = useRef(false);

        const [data, setData] = useState(() => {
          try {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
              const parsed = JSON.parse(saved);
              if (parsed?.children?.aviv && parsed?.children?.shaked) return parsed;
            }
          } catch (e) {}
          return INITIAL_DATA;
        });

        const [isParentMode, setIsParentMode] = useState(false);
        const [showPinModal, setShowPinModal] = useState(false);
        const [pinInput, setPinInput] = useState('');
        const [pinError, setPinError] = useState(false);

        const [adjModal, setAdjModal] = useState({ open: false, type: 'bonus' });
        const [adjAmount, setAdjAmount] = useState('5');
        const [adjReason, setAdjReason] = useState('');

        const [distModalOpen, setDistModalOpen] = useState(false);
        const [distSplit, setDistSplit] = useState({ available: 12, savings: 10, donation: 3 });

        const [withdrawModal, setWithdrawModal] = useState({ open: false, fundKey: 'available', amount: 0 });

        useEffect(() => {
          if (!auth || !db) return;
          let unsubscribeSnapshot = null;

          const initAuth = async () => {
            try {
              if (!auth.currentUser) await signInAnonymously(auth);
            } catch (e) {
              setCloudConnected(false);
            }
          };
          initAuth();

          const unsubscribeAuth = onAuthStateChanged(auth, (user) => {
            if (!user) return;
            const cleanCode = (familyCode || 'default-family').trim().toLowerCase();
            const docRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'families', cleanCode);

            if (unsubscribeSnapshot) unsubscribeSnapshot();
            unsubscribeSnapshot = onSnapshot(
              docRef,
              (snapshot) => {
                setCloudConnected(true);
                if (snapshot.exists()) {
                  const remoteData = snapshot.data();
                  if (remoteData?.children) {
                    isRemoteUpdateRef.current = true;
                    setData((prev) => ({
                      ...remoteData,
                      activeChildId: prev.activeChildId || remoteData.activeChildId || 'aviv'
                    }));
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(remoteData));
                  }
                } else {
                  setDoc(docRef, data, { merge: true }).catch(() => setCloudConnected(false));
                }
              },
              () => setCloudConnected(false)
            );
          });

          return () => {
            unsubscribeAuth();
            if (unsubscribeSnapshot) unsubscribeSnapshot();
          };
        }, [familyCode]);

        useEffect(() => {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
          } catch (e) {}

          if (isRemoteUpdateRef.current) {
            isRemoteUpdateRef.current = false;
            return;
          }

          if (db && auth?.currentUser && cloudConnected) {
            const cleanCode = (familyCode || 'default-family').trim().toLowerCase();
            const docRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'families', cleanCode);
            setDoc(docRef, { ...data, updatedAt: Date.now() }, { merge: true }).catch(() => setCloudConnected(false));
          }
        }, [data, familyCode, cloudConnected]);

        const handleSaveFamilyCode = (e) => {
          e.preventDefault();
          const cleaned = syncInput.trim();
          if (!cleaned) return;
          localStorage.setItem(FAMILY_ID_STORAGE_KEY, cleaned);
          setFamilyCode(cleaned);
          setShowSyncModal(false);
        };

        const activeChildId = data.activeChildId || 'aviv';
        const activeChild = data.children[activeChildId] || data.children.aviv;
        const principal = activeChild.funds?.savings?.principal || 0;
        const interest = activeChild.funds?.savings?.interest || 0;
        const totalSavingsBalance = principal + interest;

        const now = Date.now();
        const savingsDaysLeft = Math.max(0, Math.ceil(((activeChild.funds?.savings?.unlockDate || now) - now) / (1000 * 60 * 60 * 24)));
        const donationDaysLeft = Math.max(0, Math.ceil(((activeChild.funds?.donation?.unlockDate || now) - now) / (1000 * 60 * 60 * 24)));
        const isSavingsUnlocked = savingsDaysLeft === 0;
        const isDonationUnlocked = donationDaysLeft === 0;

        const handleSelectChild = (childId) => setData((prev) => ({ ...prev, activeChildId: childId }));

        const handlePinSubmit = (e) => {
          e.preventDefault();
          if (pinInput === (data.parentPin || '1234')) {
            setIsParentMode(true);
            setShowPinModal(false);
            setPinInput('');
            setPinError(false);
          } else {
            setPinError(true);
          }
        };

        const openAdjModal = (type) => {
          setAdjModal({ open: true, type });
          setAdjAmount('5');
          setAdjReason('');
        };

        const handleAddAdjustment = (e) => {
          e.preventDefault();
          const num = Math.max(1, Math.round(Number(adjAmount) || 0));
          if (!num) return;
          const delta = adjModal.type === 'bonus' ? num : -num;
          const reasonText = adjReason.trim() || (adjModal.type === 'bonus' ? 'בונוס התנהגות חיובית' : 'הפחתה על התנהגות');

          setData((prev) => {
            const child = prev.children[activeChildId];
            const newBucketAmount = Math.max(0, (child.bucket.currentAmount || 0) + delta);
            const historyEntry = {
              id: Date.now().toString(),
              date: new Date().toLocaleDateString('he-IL', { day: '2-digit', month: '2-digit' }),
              type: adjModal.type,
              amount: delta,
              description: reasonText
            };
            return {
              ...prev,
              children: {
                ...prev.children,
                [activeChildId]: {
                  ...child,
                  bucket: { ...child.bucket, currentAmount: newBucketAmount },
                  history: [historyEntry, ...(child.history || [])].slice(0, 30)
                }
              }
            };
          });
          setAdjModal({ open: false, type: 'bonus' });
        };

        const openDistModal = () => {
          const total = activeChild.bucket?.currentAmount || 0;
          const avail = Math.round(total * 0.5);
          const sav = Math.round(total * 0.4);
          const don = Math.max(0, total - avail - sav);
          setDistSplit({ available: avail, savings: sav, donation: don });
          setDistModalOpen(true);
        };

        const handleConfirmDistribution = (e) => {
          e.preventDefault();
          const totalBucket = activeChild.bucket?.currentAmount || 0;
          const avail = Math.max(0, Math.round(Number(distSplit.available) || 0));
          const sav = Math.max(0, Math.round(Number(distSplit.savings) || 0));
          const don = Math.max(0, Math.round(Number(distSplit.donation) || 0));
          if (avail + sav + don !== totalBucket) return;

          setData((prev) => {
            const child = prev.children[activeChildId];
            const updatedPrincipal = (child.funds.savings.principal || 0) + sav;
            const currentInterest = child.funds.savings.interest || 0;
            const weeklyInterest = Math.round((updatedPrincipal + currentInterest) * 0.08);
            const updatedInterest = currentInterest + weeklyInterest;

            const newHistory = [...(child.history || [])];
            const dateStr = new Date().toLocaleDateString('he-IL', { day: '2-digit', month: '2-digit' });

            if (weeklyInterest > 0) {
              newHistory.unshift({ id: `${Date.now()}-int`, date: dateStr, type: 'interest', amount: weeklyInterest, description: 'ריבית שבועית (8%) בקופת החלומות' });
            }
            newHistory.unshift({ id: `${Date.now()}-dist`, date: dateStr, type: 'distribution', amount: totalBucket, description: `חלוקה: ${avail} ₪ לארנק, ${sav} ₪ לחלומות, ${don} ₪ למעשים טובים` });

            return {
              ...prev,
              children: {
                ...prev.children,
                [activeChildId]: {
                  ...child,
                  bucket: { ...child.bucket, currentAmount: 25, adjustments: [] },
                  funds: {
                    available: { balance: (child.funds.available.balance || 0) + avail },
                    savings: { ...child.funds.savings, principal: updatedPrincipal, interest: updatedInterest },
                    donation: { ...child.funds.donation, balance: (child.funds.donation.balance || 0) + don }
                  },
                  history: newHistory.slice(0, 30)
                }
              }
            };
          });
          setDistModalOpen(false);
        };

        const openWithdrawModal = (fundKey) => {
          let maxBal = 0;
          if (fundKey === 'available') maxBal = activeChild.funds.available.balance || 0;
          if (fundKey === 'savings') maxBal = totalSavingsBalance;
          if (fundKey === 'donation') maxBal = activeChild.funds.donation.balance || 0;
          setWithdrawModal({ open: true, fundKey, amount: maxBal });
        };

        const handleConfirmWithdraw = (e) => {
          e.preventDefault();
          const { fundKey, amount } = withdrawModal;
          const num = Math.max(0, Math.round(Number(amount) || 0));

          setData((prev) => {
            const child = prev.children[activeChildId];
            const dateStr = new Date().toLocaleDateString('he-IL', { day: '2-digit', month: '2-digit' });
            const updatedFunds = { ...child.funds };
            let logDesc = '';

            if (fundKey === 'available') {
              const deduct = Math.min(num, child.funds.available.balance || 0);
              updatedFunds.available = { balance: Math.max(0, (child.funds.available.balance || 0) - deduct) };
              logDesc = `משיכה מהארנק שלי (-${deduct} ₪)`;
            } else if (fundKey === 'donation') {
              const deduct = Math.min(num, child.funds.donation.balance || 0);
              updatedFunds.donation = { ...child.funds.donation, balance: Math.max(0, (child.funds.donation.balance || 0) - deduct), unlockDate: Date.now() + 90 * 24 * 60 * 60 * 1000 };
              logDesc = `תרומה מקופת מעשים טובים (-${deduct} ₪)`;
            } else if (fundKey === 'savings') {
              const totalSav = (child.funds.savings.principal || 0) + (child.funds.savings.interest || 0);
              const deduct = Math.min(num, totalSav);
              const remaining = Math.max(0, totalSav - deduct);
              const newInterest = Math.max(0, (child.funds.savings.interest || 0) - deduct);
              const leftoverDeduct = Math.max(0, deduct - (child.funds.savings.interest || 0));
              const newPrincipal = Math.max(0, (child.funds.savings.principal || 0) - leftoverDeduct);

              updatedFunds.savings = {
                ...child.funds.savings,
                principal: remaining === 0 ? 0 : newPrincipal,
                interest: remaining === 0 ? 0 : newInterest,
                unlockDate: remaining === 0 ? Date.now() + 90 * 24 * 60 * 60 * 1000 : child.funds.savings.unlockDate
              };
              updatedFunds.available = { balance: (child.funds.available.balance || 0) + deduct };
              logDesc = `העברה מקופת החלומות לארנק שלי (${deduct} ₪)`;
            }

            const historyEntry = { id: Date.now().toString(), date: dateStr, type: fundKey === 'savings' ? 'transfer' : 'withdraw', amount: -num, description: logDesc };
            return {
              ...prev,
              children: {
                ...prev.children,
                [activeChildId]: { ...child, funds: updatedFunds, history: [historyEntry, ...(child.history || [])].slice(0, 30) }
              }
            };
          });
          setWithdrawModal({ open: false, fundKey: 'available', amount: 0 });
        };

        const handleSimulate5Weeks = () => {
          setData((prev) => {
            const child = prev.children[activeChildId];
            let simPrincipal = child.funds.savings.principal || 0;
            let simInterest = child.funds.savings.interest || 0;
            let simAvailable = child.funds.available.balance || 0;
            let simDonation = child.funds.donation.balance || 0;

            for (let w = 1; w <= 5; w++) {
              simAvailable += 12;
              simPrincipal += 10;
              simDonation += 3;
              simInterest += Math.round((simPrincipal + simInterest) * 0.08);
            }

            const dateStr = new Date().toLocaleDateString('he-IL', { day: '2-digit', month: '2-digit' });
            const simHistory = [
              { id: `${Date.now()}-sim`, date: dateStr, type: 'interest', amount: simInterest - (child.funds.savings.interest || 0), description: 'הדמיית 5 שבועות (+8% ריבית שבועית מצטברת)' },
              ...(child.history || [])
            ].slice(0, 30);

            return {
              ...prev,
              children: {
                ...prev.children,
                [activeChildId]: {
                  ...child,
                  funds: {
                    available: { balance: simAvailable },
                    savings: { principal: simPrincipal, interest: simInterest, unlockDate: (child.funds.savings.unlockDate || Date.now()) - 35 * 24 * 60 * 60 * 1000 },
                    donation: { balance: simDonation, unlockDate: (child.funds.donation.unlockDate || Date.now()) - 35 * 24 * 60 * 60 * 1000 }
                  },
                  history: simHistory
                }
              }
            };
          });
        };

        const handleResetChild = () => {
          setData((prev) => ({
            ...prev,
            children: { ...prev.children, [activeChildId]: JSON.parse(JSON.stringify(INITIAL_DATA.children[activeChildId])) }
          }));
        };

        const splitSum = (Number(distSplit.available) || 0) + (Number(distSplit.savings) || 0) + (Number(distSplit.donation) || 0);
        const bucketTotal = activeChild.bucket?.currentAmount || 0;

        return (
          <div dir="rtl" className="h-[100dvh] w-full bg-slate-950 text-slate-100 flex justify-center overflow-hidden select-none font-sans">
            <div className="w-full max-w-md h-full bg-slate-900/95 border-x border-slate-800/80 flex flex-col p-2.5 gap-2 overflow-hidden">
              <header className="flex items-center justify-between bg-slate-800/80 border border-slate-700/70 rounded-xl px-3 py-2 shrink-0">
                <div className="flex items-center gap-2">
                  <div className="w-7 h-7 rounded-lg bg-gradient-to-br from-amber-400 to-orange-500 flex items-center justify-center text-slate-950 shadow">
                    <Coins className="w-4 h-4" />
                  </div>
                  <h1 className="text-sm font-black tracking-tight text-white">בנק המשפחה</h1>
                  <button
                    onClick={() => { setSyncInput(familyCode); setShowSyncModal(true); }}
                    title={cloudConnected ? `מסונכרן לענן (${familyCode})` : 'מצב מקומי - לחץ להגדרת סנכרון'}
                    className={`flex items-center gap-1 text-[10px] px-1.5 py-0.5 rounded-md border transition-all ${
                      cloudConnected ? 'bg-emerald-500/15 border-emerald-500/40 text-emerald-300' : 'bg-slate-700/60 border-slate-600 text-slate-400'
                    }`}
                  >
                    {cloudConnected ? <Cloud className="w-3 h-3" /> : <CloudOff className="w-3 h-3" />}
                    <span>{cloudConnected ? 'מסונכרן' : 'מקומי'}</span>
                  </button>
                </div>

                <div className="flex items-center gap-1.5">
                  {isParentMode ? (
                    <div className="flex items-center gap-1">
                      <button onClick={handleSimulate5Weeks} className="flex items-center gap-1 text-[10px] bg-indigo-600/80 hover:bg-indigo-500 text-white font-bold px-2 py-1 rounded-lg transition-all">
                        <FastForward className="w-3 h-3" />
                        <span>+5 שבועות</span>
                      </button>
                      <button onClick={handleResetChild} className="p-1 bg-slate-700 hover:bg-rose-600/80 text-slate-300 hover:text-white rounded-lg transition-all">
                        <RotateCcw className="w-3.5 h-3.5" />
                      </button>
                      <button onClick={() => setIsParentMode(false)} className="flex items-center gap-1 text-[11px] bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-2 py-1 rounded-lg transition-all shadow">
                        <Users className="w-3 h-3" />
                        <span>אזור ילדים</span>
                      </button>
                    </div>
                  ) : (
                    <button onClick={() => setShowPinModal(true)} className="flex items-center gap-1 text-[11px] bg-slate-700/80 hover:bg-slate-700 text-slate-300 font-medium px-2.5 py-1 rounded-lg border border-slate-600 transition-all">
                      <ShieldCheck className="w-3.5 h-3.5 text-amber-400" />
                      <span>אזור הורים</span>
                    </button>
                  )}
                </div>
              </header>

              <section className="grid grid-cols-2 gap-1.5 bg-slate-800/70 p-1 rounded-xl border border-slate-700/60 shrink-0">
                {Object.entries(data.children || INITIAL_DATA.children).map(([childId, child]) => {
                  const isSelected = activeChildId === childId;
                  return (
                    <button
                      key={childId}
                      onClick={() => handleSelectChild(childId)}
                      className={`flex items-center justify-center gap-1.5 py-1.5 px-3 rounded-lg font-extrabold text-xs transition-all ${
                        isSelected ? 'bg-gradient-to-r from-indigo-600 to-purple-600 text-white shadow' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-700/40'
                      }`}
                    >
                      <User className="w-3.5 h-3.5" />
                      <span>{child.name}</span>
                    </button>
                  );
                })}
              </section>

              <main className="flex-1 flex flex-col gap-2 min-h-0 overflow-hidden">
                {!isParentMode ? (
                  <section className="grid grid-cols-2 gap-2 shrink-0">
                    <div className="bg-gradient-to-br from-slate-800 via-indigo-900/40 to-slate-800 border border-indigo-500/40 rounded-2xl p-2.5 shadow-lg flex flex-col justify-between items-center text-center aspect-[1/0.92]">
                      <div className="flex items-center gap-1 text-indigo-300 text-xs font-bold">
                        <Coins className="w-3.5 h-3.5 shrink-0" />
                        <span>מיכל שבועי</span>
                      </div>
                      <div className="my-auto">
                        <span className="text-5xl font-black text-amber-400 leading-none tracking-tight">{activeChild.bucket?.currentAmount || 0} ₪</span>
                      </div>
                      <div>
                        <span className="text-[11px] whitespace-nowrap bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 px-2.5 py-0.5 rounded-full font-bold inline-flex items-center gap-1">ממתין לחלוקה</span>
                      </div>
                    </div>

                    <div className="bg-slate-800/90 border border-slate-700/80 rounded-2xl p-2.5 shadow-lg flex flex-col justify-between items-center text-center aspect-[1/0.92]">
                      <div className="flex items-center gap-1 text-slate-200 text-xs font-bold">
                        <Wallet className="w-3.5 h-3.5 text-amber-400 shrink-0" />
                        <span>הארנק שלי 🛍️</span>
                      </div>
                      <div className="my-auto">
                        <span className="text-5xl font-black text-amber-400 leading-none tracking-tight">{activeChild.funds?.available?.balance || 0} ₪</span>
                      </div>
                      <div>
                        <span className="text-[11px] whitespace-nowrap bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-2.5 py-0.5 rounded-full font-bold inline-flex items-center gap-1">
                          <Unlock className="w-3 h-3 shrink-0" /> זמין
                        </span>
                      </div>
                    </div>

                    <div className="bg-slate-800/90 border border-indigo-500/40 rounded-2xl p-2.5 shadow-lg relative flex flex-col justify-between items-center text-center aspect-[1/0.92]">
                      <div className="absolute right-2 top-3 bottom-3 w-2 bg-slate-950 rounded-full overflow-hidden flex flex-col-reverse border border-slate-700/80">
                        <div className="bg-indigo-500 w-full transition-all duration-500" style={{ height: totalSavingsBalance > 0 ? `${(principal / totalSavingsBalance) * 100}%` : '100%' }} />
                        <div className="bg-emerald-400 w-full transition-all duration-500" style={{ height: totalSavingsBalance > 0 ? `${(interest / totalSavingsBalance) * 100}%` : '0%' }} />
                      </div>
                      <div className="flex items-center gap-1 text-slate-200 text-xs font-bold pr-2">
                        <TrendingUp className="w-3.5 h-3.5 text-indigo-400 shrink-0" />
                        <span>קופת החלומות 🚀</span>
                      </div>
                      <div className="my-auto pr-2 flex flex-col items-center">
                        <span className="text-5xl font-black text-indigo-300 leading-none tracking-tight">{totalSavingsBalance} ₪</span>
                        <div className="flex items-center gap-1.5 mt-1 text-[9px] font-bold">
                          <span className="text-indigo-300">קרן {principal}</span>
                          <span className="text-slate-600">|</span>
                          <span className="text-emerald-400">ריבית +{interest}</span>
                        </div>
                      </div>
                      <div className="pr-2">
                        {isSavingsUnlocked ? (
                          <span className="text-[11px] whitespace-nowrap bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-2.5 py-0.5 rounded-full font-bold inline-flex items-center gap-1"><Unlock className="w-3 h-3 shrink-0" /> פתוח</span>
                        ) : (
                          <span className="text-[11px] whitespace-nowrap bg-amber-500/20 text-amber-300 border border-amber-500/30 px-2.5 py-0.5 rounded-full font-bold inline-flex items-center gap-1"><Lock className="w-3 h-3 shrink-0" /> {savingsDaysLeft} ימים</span>
                        )}
                      </div>
                    </div>

                    <div className="bg-slate-800/90 border border-rose-500/30 rounded-2xl p-2.5 shadow-lg flex flex-col justify-between items-center text-center aspect-[1/0.92]">
                      <div className="flex items-center gap-1 text-slate-200 text-xs font-bold">
                        <Heart className="w-3.5 h-3.5 text-rose-400 shrink-0" />
                        <span>מעשים טובים 💖</span>
                      </div>
                      <div className="my-auto">
                        <span className="text-5xl font-black text-rose-400 leading-none tracking-tight">{activeChild.funds?.donation?.balance || 0} ₪</span>
                      </div>
                      <div>
                        {isDonationUnlocked ? (
                          <span className="text-[11px] whitespace-nowrap bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-2.5 py-0.5 rounded-full font-bold inline-flex items-center gap-1"><Unlock className="w-3 h-3 shrink-0" /> פתוח</span>
                        ) : (
                          <span className="text-[11px] whitespace-nowrap bg-rose-500/20 text-rose-300 border border-rose-500/30 px-2.5 py-0.5 rounded-full font-bold inline-flex items-center gap-1"><Calendar className="w-3 h-3 shrink-0" /> {donationDaysLeft} ימים</span>
                        )}
                      </div>
                    </div>
                  </section>
                ) : (
                  <section className="grid grid-cols-2 gap-2 shrink-0">
                    <div className="bg-gradient-to-br from-slate-800 via-indigo-900/40 to-slate-800 border border-indigo-500/50 rounded-2xl p-2 shadow-lg flex flex-col justify-between items-center text-center aspect-[1/0.92]">
                      <div className="flex items-center justify-between w-full px-1">
                        <button onClick={() => openAdjModal('penalty')} className="p-1 bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 border border-rose-500/30 rounded-lg"><Minus className="w-3.5 h-3.5" /></button>
                        <span className="text-indigo-300 text-xs font-bold">מיכל שבועי</span>
                        <button onClick={() => openAdjModal('bonus')} className="p-1 bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-300 border border-emerald-500/30 rounded-lg"><Plus className="w-3.5 h-3.5" /></button>
                      </div>
                      <div className="my-auto">
                        <span className="text-5xl font-black text-amber-400 leading-none tracking-tight">{activeChild.bucket?.currentAmount || 0} ₪</span>
                      </div>
                      <button onClick={openDistModal} className="w-full py-1 px-2 bg-indigo-600 hover:bg-indigo-500 text-white text-[11px] font-bold rounded-xl shadow flex items-center justify-center gap-1 transition-all">
                        <ArrowUpRight className="w-3.5 h-3.5" />
                        <span>העבר לקופות</span>
                      </button>
                    </div>

                    <div onClick={() => openWithdrawModal('available')} className="cursor-pointer bg-slate-800/90 hover:bg-slate-800 border border-slate-700 hover:border-amber-500/50 rounded-2xl p-2.5 shadow-lg flex flex-col justify-between items-center text-center aspect-[1/0.92] transition-all">
                      <div className="flex items-center gap-1 text-slate-200 text-xs font-bold">
                        <Wallet className="w-3.5 h-3.5 text-amber-400 shrink-0" />
                        <span>הארנק שלי 🛍️</span>
                      </div>
                      <div className="my-auto">
                        <span className="text-5xl font-black text-amber-400 leading-none tracking-tight">{activeChild.funds?.available?.balance || 0} ₪</span>
                      </div>
                      <div>
                        <span className="text-[11px] whitespace-nowrap bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-2.5 py-0.5 rounded-full font-bold inline-flex items-center gap-1"><Unlock className="w-3 h-3 shrink-0" /> זמין</span>
                      </div>
                    </div>

                    <div onClick={() => openWithdrawModal('savings')} className="cursor-pointer bg-slate-800/90 hover:bg-slate-800 border border-indigo-500/40 hover:border-indigo-400 rounded-2xl p-2.5 shadow-lg relative flex flex-col justify-between items-center text-center aspect-[1/0.92] transition-all">
                      <div className="absolute right-2 top-3 bottom-3 w-2 bg-slate-950 rounded-full overflow-hidden flex flex-col-reverse border border-slate-700/80">
                        <div className="bg-indigo-500 w-full transition-all duration-500" style={{ height: totalSavingsBalance > 0 ? `${(principal / totalSavingsBalance) * 100}%` : '100%' }} />
                        <div className="bg-emerald-400 w-full transition-all duration-500" style={{ height: totalSavingsBalance > 0 ? `${(interest / totalSavingsBalance) * 100}%` : '0%' }} />
                      </div>
                      <div className="flex items-center gap-1 text-slate-200 text-xs font-bold pr-2">
                        <TrendingUp className="w-3.5 h-3.5 text-indigo-400 shrink-0" />
                        <span>קופת החלומות 🚀</span>
                      </div>
                      <div className="my-auto pr-2 flex flex-col items-center">
                        <span className="text-5xl font-black text-indigo-300 leading-none tracking-tight">{totalSavingsBalance} ₪</span>
                        <div className="flex items-center gap-1.5 mt-1 text-[9px] font-bold">
                          <span className="text-indigo-300">קרן {principal}</span>
                          <span className="text-slate-600">|</span>
                          <span className="text-emerald-400">ריבית +{interest}</span>
                        </div>
                      </div>
                      <div className="pr-2">
                        {isSavingsUnlocked ? (
                          <span className="text-[11px] whitespace-nowrap bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-2.5 py-0.5 rounded-full font-bold inline-flex items-center gap-1"><Unlock className="w-3 h-3 shrink-0" /> פתוח</span>
                        ) : (
                          <span className="text-[11px] whitespace-nowrap bg-amber-500/20 text-amber-300 border border-amber-500/30 px-2.5 py-0.5 rounded-full font-bold inline-flex items-center gap-1"><Lock className="w-3 h-3 shrink-0" /> {savingsDaysLeft} ימים</span>
                        )}
                      </div>
                    </div>

                    <div onClick={() => openWithdrawModal('donation')} className="cursor-pointer bg-slate-800/90 hover:bg-slate-800 border border-rose-500/30 hover:border-rose-400/60 rounded-2xl p-2.5 shadow-lg flex flex-col justify-between items-center text-center aspect-[1/0.92] transition-all">
                      <div className="flex items-center gap-1 text-slate-200 text-xs font-bold">
                        <Heart className="w-3.5 h-3.5 text-rose-400 shrink-0" />
                        <span>מעשים טובים 💖</span>
                      </div>
                      <div className="my-auto">
                        <span className="text-5xl font-black text-rose-400 leading-none tracking-tight">{activeChild.funds?.donation?.balance || 0} ₪</span>
                      </div>
                      <div>
                        {isDonationUnlocked ? (
                          <span className="text-[11px] whitespace-nowrap bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-2.5 py-0.5 rounded-full font-bold inline-flex items-center gap-1"><Unlock className="w-3 h-3 shrink-0" /> פתוח</span>
                        ) : (
                          <span className="text-[11px] whitespace-nowrap bg-rose-500/20 text-rose-300 border border-rose-500/30 px-2.5 py-0.5 rounded-full font-bold inline-flex items-center gap-1"><Calendar className="w-3 h-3 shrink-0" /> {donationDaysLeft} ימים</span>
                        )}
                      </div>
                    </div>
                  </section>
                )}

                <section className="flex-1 bg-slate-800/60 border border-slate-700/70 rounded-2xl p-2.5 flex flex-col min-h-0 overflow-hidden">
                  <div className="flex items-center justify-between mb-1.5 shrink-0">
                    <div className="flex items-center gap-1.5 text-xs font-bold text-slate-300">
                      <History className="w-3.5 h-3.5 text-indigo-400" />
                      <span>היסטוריית פעולות ({activeChild.name})</span>
                    </div>
                    <span className="text-[10px] text-slate-400">30 ימים אחרונים</span>
                  </div>

                  <div className="flex-1 overflow-y-auto space-y-1.5 pl-0.5">
                    {!activeChild.history || activeChild.history.length === 0 ? (
                      <div className="h-full flex items-center justify-center text-xs text-slate-500">אין פעולות מתועדות עדיין</div>
                    ) : (
                      activeChild.history.map((item) => (
                        <div key={item.id} className="flex items-center justify-between bg-slate-900/70 border border-slate-800 rounded-xl px-2.5 py-1.5 text-xs">
                          <div className="flex items-center gap-2 min-w-0">
                            <span className="text-[10px] text-slate-500 shrink-0">{item.date}</span>
                            <span className="text-slate-200 truncate">{item.description}</span>
                          </div>
                          <span className={`font-extrabold shrink-0 mr-2 ${item.amount > 0 ? 'text-emerald-400' : item.amount < 0 ? 'text-rose-400' : 'text-slate-300'}`}>
                            {item.amount > 0 ? `+${item.amount}` : item.amount} ₪
                          </span>
                        </div>
                      ))
                    )}
                  </div>
                </section>
              </main>
            </div>

            {showPinModal && (
              <div className="fixed inset-0 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                <form onSubmit={handlePinSubmit} className="bg-slate-900 border border-slate-700 rounded-2xl p-5 w-full max-w-xs space-y-4 shadow-2xl">
                  <div className="flex items-center justify-between">
                    <h3 className="font-bold text-base text-white flex items-center gap-1.5"><ShieldCheck className="w-4 h-4 text-amber-400" /><span>כניסת הורים</span></h3>
                    <button type="button" onClick={() => { setShowPinModal(false); setPinError(false); setPinInput(''); }} className="text-slate-400 hover:text-white"><X className="w-4 h-4" /></button>
                  </div>
                  <div>
                    <input type="password" inputMode="numeric" maxLength={4} autoFocus value={pinInput} onChange={(e) => { setPinInput(e.target.value); setPinError(false); }} placeholder="קוד הורים (1234)" className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-center text-lg tracking-widest font-bold text-white focus:outline-none focus:border-indigo-500" />
                    {pinError && <p className="text-rose-400 text-xs mt-1.5 text-center font-medium">קוד שגוי, נסו שוב</p>}
                  </div>
                  <button type="submit" className="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl text-sm transition-all">כניסה</button>
                </form>
              </div>
            )}

            {adjModal.open && (
              <div className="fixed inset-0 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                <form onSubmit={handleAddAdjustment} className="bg-slate-900 border border-slate-700 rounded-2xl p-5 w-full max-w-xs space-y-4 shadow-2xl">
                  <div className="flex items-center justify-between">
                    <h3 className="font-bold text-base text-white">{adjModal.type === 'bonus' ? 'הוספת בונוס למיכל' : 'הפחתה מהמיכל'}</h3>
                    <button type="button" onClick={() => setAdjModal({ open: false, type: 'bonus' })} className="text-slate-400 hover:text-white"><X className="w-4 h-4" /></button>
                  </div>
                  <div className="space-y-3">
                    <div>
                      <label className="text-xs text-slate-300 block mb-1">סכום בשקלים</label>
                      <input type="number" min="1" max="200" value={adjAmount} onChange={(e) => setAdjAmount(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white font-bold text-center text-lg" />
                    </div>
                    <div>
                      <label className="text-xs text-slate-300 block mb-1">סיבה (אופציונלי)</label>
                      <input type="text" value={adjReason} onChange={(e) => setAdjReason(e.target.value)} placeholder={adjModal.type === 'bonus' ? 'לדוגמה: עזרה בבית' : 'לדוגמה: אי עמידה בזמנים'} className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white" />
                    </div>
                  </div>
                  <button type="submit" className={`w-full py-2.5 font-bold rounded-xl text-sm text-white transition-all ${adjModal.type === 'bonus' ? 'bg-emerald-600 hover:bg-emerald-500' : 'bg-rose-600 hover:bg-rose-500'}`}>אישור ועדכון</button>
                </form>
              </div>
            )}

            {distModalOpen && (
              <div className="fixed inset-0 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                <form onSubmit={handleConfirmDistribution} className="bg-slate-900 border border-slate-700 rounded-2xl p-5 w-full max-w-xs space-y-4 shadow-2xl">
                  <div className="flex items-center justify-between">
                    <h3 className="font-bold text-base text-white">חלוקת מיכל ({bucketTotal} ₪)</h3>
                    <button type="button" onClick={() => setDistModalOpen(false)} className="text-slate-400 hover:text-white"><X className="w-4 h-4" /></button>
                  </div>
                  <div className="space-y-2.5 text-sm">
                    <div className="flex items-center justify-between bg-slate-800 p-2.5 rounded-xl">
                      <span className="font-bold text-amber-400">הארנק שלי 🛍️</span>
                      <input type="number" min="0" max={bucketTotal} value={distSplit.available} onChange={(e) => setDistSplit({ ...distSplit, available: Number(e.target.value) || 0 })} className="w-20 bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-center font-bold text-white" />
                    </div>
                    <div className="flex items-center justify-between bg-slate-800 p-2.5 rounded-xl">
                      <span className="font-bold text-indigo-300">קופת החלומות 🚀</span>
                      <input type="number" min="0" max={bucketTotal} value={distSplit.savings} onChange={(e) => setDistSplit({ ...distSplit, savings: Number(e.target.value) || 0 })} className="w-20 bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-center font-bold text-white" />
                    </div>
                    <div className="flex items-center justify-between bg-slate-800 p-2.5 rounded-xl">
                      <span className="font-bold text-rose-400">מעשים טובים 💖</span>
                      <input type="number" min="0" max={bucketTotal} value={distSplit.donation} onChange={(e) => setDistSplit({ ...distSplit, donation: Number(e.target.value) || 0 })} className="w-20 bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-center font-bold text-white" />
                    </div>
                  </div>
                  <div className="flex items-center justify-between text-xs px-1">
                    <span className="text-slate-400">סה״כ מחולק:</span>
                    <span className={`font-bold ${splitSum === bucketTotal ? 'text-emerald-400' : 'text-rose-400'}`}>{splitSum} / {bucketTotal} ₪</span>
                  </div>
                  <button type="submit" disabled={splitSum !== bucketTotal} className="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-700 disabled:text-slate-500 text-white font-bold rounded-xl text-sm flex items-center justify-center gap-1.5 transition-all">
                    <Check className="w-4 h-4" />
                    <span>אישור והעברה לקופות</span>
                  </button>
                </form>
              </div>
            )}

            {withdrawModal.open && (
              <div className="fixed inset-0 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                <form onSubmit={handleConfirmWithdraw} className="bg-slate-900 border border-slate-700 rounded-2xl p-5 w-full max-w-xs space-y-4 shadow-2xl">
                  <div className="flex items-center justify-between">
                    <h3 className="font-bold text-base text-white">האם למשוך עכשיו?</h3>
                    <button type="button" onClick={() => setWithdrawModal({ open: false, fundKey: 'available', amount: 0 })} className="text-slate-400 hover:text-white"><X className="w-4 h-4" /></button>
                  </div>
                  <p className="text-xs text-slate-300">
                    {withdrawModal.fundKey === 'savings'
                      ? 'משיכה מקופת החלומות תעביר את הסכום ישירות לתוך "הארנק שלי".'
                      : withdrawModal.fundKey === 'donation'
                      ? 'אישור פעולה זו יאפס/יפחית את הסכום מקופת מעשים טובים לצורך תרומה.'
                      : 'אישור פעולה זו יפחית את הסכום מיתרת "הארנק שלי".'}
                  </p>
                  <div>
                    <label className="text-xs text-slate-400 block mb-1">סכום למשיכה (₪)</label>
                    <input type="number" min="0" value={withdrawModal.amount} onChange={(e) => setWithdrawModal({ ...withdrawModal, amount: Number(e.target.value) || 0 })} className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-center text-xl font-black text-white" />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <button type="button" onClick={() => setWithdrawModal({ open: false, fundKey: 'available', amount: 0 })} className="py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl text-xs">ביטול</button>
                    <button type="submit" className="py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl text-xs">אישור</button>
                  </div>
                </form>
              </div>
            )}

            {showSyncModal && (
              <div className="fixed inset-0 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                <form onSubmit={handleSaveFamilyCode} className="bg-slate-900 border border-slate-700 rounded-2xl p-5 w-full max-w-xs space-y-4 shadow-2xl">
                  <div className="flex items-center justify-between">
                    <h3 className="font-bold text-base text-white flex items-center gap-1.5"><Cloud className="w-4 h-4 text-emerald-400" /><span>סנכרון בין מכשירים</span></h3>
                    <button type="button" onClick={() => setShowSyncModal(false)} className="text-slate-400 hover:text-white"><X className="w-4 h-4" /></button>
                  </div>
                  <p className="text-xs text-slate-300 leading-relaxed">
                    הזינו את אותו <strong>קוד משפחה</strong> בטלפונים של ההורים והילדים כדי שכל היתרות והפעולות יסתנכרנו בזמן אמת:
                  </p>
                  <div>
                    <label className="text-xs text-slate-400 block mb-1">קוד משפחה משותף</label>
                    <input type="text" dir="ltr" value={syncInput} onChange={(e) => setSyncInput(e.target.value)} placeholder="לדוגמה: family-2026" className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-center font-bold text-white text-sm" />
                  </div>
                  <button type="submit" className="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl text-sm transition-all">חיבור וסנכרון</button>
                </form>
              </div>
            )}
          </div>
        );
      }

      const root = createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
