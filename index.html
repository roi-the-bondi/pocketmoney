<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>הבנק המשפחתי - אביב ושקד</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Rubik', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">
  <div id="root"></div>

  <script type="module">
    import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    window.__FB_SDK__ = { initializeApp, getApps, getFirestore, doc, onSnapshot, setDoc, getAuth, signInAnonymously, onAuthStateChanged };
  </script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyCidsufAj_YTodxVumZq7V1GKmpfMhysZ0",
      authDomain: "pocket-money-f9e07.firebaseapp.com",
      projectId: "pocket-money-f9e07",
      storageBucket: "pocket-money-f9e07.firebasestorage.app",
      messagingSenderId: "293671775732",
      appId: "1:293671775732:web:336a9aae201c3c3240dda1",
      measurementId: "G-RC3W1X1V51"
    };

    const APP_ID = 'family-pocket-money';
    const FAMILY_ID_STORAGE_KEY = 'family_pocket_money_sync_code';
    const STORAGE_KEY = 'family_pocket_money_v1';

    const createInitialData = () => ({
      activeChildId: 'aviv',
      parentPin: '2974',
      children: {
        aviv: {
          name: 'אביב',
          bucket: { baseAmount: 25, currentAmount: 25, adjustments: [] },
          funds: {
            available: { balance: 0 },
            savings: { principal: 0, interest: 0, unlockDate: Date.now() + 90 * 24 * 60 * 60 * 1000 },
            donation: { balance: 0, unlockDate: Date.now() + 90 * 24 * 60 * 60 * 1000 }
          },
          history: []
        },
        shaked: {
          name: 'שקד',
          bucket: { baseAmount: 25, currentAmount: 25, adjustments: [] },
          funds: {
            available: { balance: 0 },
            savings: { principal: 0, interest: 0, unlockDate: Date.now() + 90 * 24 * 60 * 60 * 1000 },
            donation: { balance: 0, unlockDate: Date.now() + 90 * 24 * 60 * 60 * 1000 }
          },
          history: []
        }
      }
    });

    function App() {
      const [familyCode, setFamilyCode] = useState(() => localStorage.getItem(FAMILY_ID_STORAGE_KEY) || 'family-aviv-shaked');
      const [cloudConnected, setCloudConnected] = useState(false);
      const [showSyncModal, setShowSyncModal] = useState(false);
      const [syncInput, setSyncInput] = useState('');
      const isRemoteUpdateRef = useRef(false);
      const dbRef = useRef(null);
      const authRef = useRef(null);

      const [data, setData] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed && parsed.children?.aviv && parsed.children?.shaked) return parsed;
          }
        } catch (e) {}
        return createInitialData();
      });

      const [isParentMode, setIsParentMode] = useState(false);
      const [showPinModal, setShowPinModal] = useState(false);
      const [pinInput, setPinInput] = useState('');
      const [pinError, setPinError] = useState(false);

      const [adjModal, setAdjModal] = useState({ open: false, type: 'bonus' });
      const [adjAmount, setAdjAmount] = useState('5');
      const [adjReason, setAdjReason] = useState('');

      const [distModalOpen, setDistModalOpen] = useState(false);
      const [distSplit, setDistSplit] = useState({ available: 12.5, savings: 10, donation: 2.5 });

      const [withdrawModal, setWithdrawModal] = useState({ open: false, fundKey: 'available', maxAmount: 0 });
      const [withdrawInput, setWithdrawInput] = useState('');
      const [withdrawReason, setWithdrawReason] = useState('');
      const [withdrawError, setWithdrawError] = useState('');

      const [showSettingsModal, setShowSettingsModal] = useState(false);
      const [newPinInput, setNewPinInput] = useState('');
      const [pinSavedMsg, setPinSavedMsg] = useState(false);
      const [resetStreetInput, setResetStreetInput] = useState('');
      const [resetErrorMsg, setResetErrorMsg] = useState('');

      useEffect(() => {
        let unsubscribeAuth = null;
        let unsubscribeSnapshot = null;

        const setupFirebase = () => {
          const sdk = window.__FB_SDK__;
          if (!sdk) {
            setTimeout(setupFirebase, 150);
            return;
          }
          try {
            const app = sdk.getApps().length === 0 ? sdk.initializeApp(FIREBASE_CONFIG) : sdk.getApps()[0];
            const db = sdk.getFirestore(app);
            const auth = sdk.getAuth(app);
            dbRef.current = db;
            authRef.current = auth;

            sdk.signInAnonymously(auth).catch(() => setCloudConnected(false));

            unsubscribeAuth = sdk.onAuthStateChanged(auth, (user) => {
              if (!user) return;
              const cleanCode = (familyCode || 'default-family').trim().toLowerCase();
              const docRef = sdk.doc(db, 'artifacts', APP_ID, 'public', 'data', 'families', cleanCode);
              if (unsubscribeSnapshot) unsubscribeSnapshot();

              unsubscribeSnapshot = sdk.onSnapshot(docRef, (snapshot) => {
                setCloudConnected(true);
                if (snapshot.exists()) {
                  const remoteData = snapshot.data();
                  if (remoteData && remoteData.children) {
                    isRemoteUpdateRef.current = true;
                    setData((prev) => ({
                      ...remoteData,
                      activeChildId: prev.activeChildId || remoteData.activeChildId || 'aviv'
                    }));
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(remoteData));
                  }
                } else {
                  sdk.setDoc(docRef, data, { merge: true }).catch(() => setCloudConnected(false));
                }
              }, () => setCloudConnected(false));
            });
          } catch (e) {
            setCloudConnected(false);
          }
        };

        setupFirebase();
        return () => {
          if (unsubscribeAuth) unsubscribeAuth();
          if (unsubscribeSnapshot) unsubscribeSnapshot();
        };
      }, [familyCode]);

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        } catch (e) {}

        if (isRemoteUpdateRef.current) {
          isRemoteUpdateRef.current = false;
          return;
        }

        const sdk = window.__FB_SDK__;
        if (sdk && dbRef.current && authRef.current?.currentUser && cloudConnected) {
          const cleanCode = (familyCode || 'default-family').trim().toLowerCase();
          const docRef = sdk.doc(dbRef.current, 'artifacts', APP_ID, 'public', 'data', 'families', cleanCode);
          sdk.setDoc(docRef, { ...data, updatedAt: Date.now() }, { merge: true }).catch(() => setCloudConnected(false));
        }
      }, [data, familyCode, cloudConnected]);

      const activeChildId = data.activeChildId || 'aviv';
      const activeChild = data.children[activeChildId] || data.children.aviv;
      const principal = activeChild.funds?.savings?.principal || 0;
      const interest = activeChild.funds?.savings?.interest || 0;
      const totalSavingsBalance = principal + interest;

      const now = Date.now();
      const savingsDaysLeft = Math.max(0, Math.ceil(((activeChild.funds?.savings?.unlockDate || now) - now) / (1000 * 60 * 60 * 24)));
      const donationDaysLeft = Math.max(0, Math.ceil(((activeChild.funds?.donation?.unlockDate || now) - now) / (1000 * 60 * 60 * 24)));
      const isSavingsUnlocked = savingsDaysLeft === 0;
      const isDonationUnlocked = donationDaysLeft === 0;

      const handleSelectChild = (childId) => {
        setData((prev) => ({ ...prev, activeChildId: childId }));
      };

      const handlePinSubmit = (e) => {
        e.preventDefault();
        if (pinInput === (data.parentPin || '2974')) {
          setIsParentMode(true);
          setShowPinModal(false);
          setPinInput('');
          setPinError(false);
        } else {
          setPinError(true);
        }
      };

      const handleSaveFamilyCode = (e) => {
        e.preventDefault();
        const cleaned = syncInput.trim();
        if (!cleaned) return;
        localStorage.setItem(FAMILY_ID_STORAGE_KEY, cleaned);
        setFamilyCode(cleaned);
        setShowSyncModal(false);
      };

      const handleChangePin = (e) => {
        e.preventDefault();
        if (!newPinInput.trim()) return;
        setData((prev) => ({ ...prev, parentPin: newPinInput.trim() }));
        setNewPinInput('');
        setPinSavedMsg(true);
        setTimeout(() => setPinSavedMsg(false), 2500);
      };

      const handleSecureReset = (e) => {
        e.preventDefault();
        const normalized = resetStreetInput.trim().replace(/^רחוב\s+/, '');
        if (normalized !== 'הקליר') {
          setResetErrorMsg('שם הרחוב שגוי. לא ניתן לאפס את הנתונים.');
          return;
        }
        const currentPin = data.parentPin || '2974';
        const fresh = createInitialData();
        fresh.parentPin = currentPin;
        setData(fresh);
        setResetStreetInput('');
        setResetErrorMsg('');
        setShowSettingsModal(false);
      };

      const openAdjustmentModal = (type) => {
        setAdjModal({ open: true, type });
        setAdjAmount('5');
        setAdjReason('');
      };

      const handleAddAdjustment = (e) => {
        e.preventDefault();
        const val = parseFloat(adjAmount);
        if (isNaN(val) || val <= 0) return;
        const delta = adjModal.type === 'bonus' ? val : -val;
        const label = adjReason.trim() || (adjModal.type === 'bonus' ? 'בונוס התנהגות חיובית' : 'הפחתה');

        setData((prev) => {
          const child = prev.children[activeChildId];
          const newCurrent = Math.max(0, +(child.bucket.currentAmount + delta).toFixed(2));
          return {
            ...prev,
            children: {
              ...prev.children,
              [activeChildId]: {
                ...child,
                bucket: {
                  ...child.bucket,
                  currentAmount: newCurrent,
                  adjustments: [{ id: Date.now(), delta, reason: label }, ...child.bucket.adjustments]
                },
                history: [{ id: Date.now(), date: new Date().toLocaleDateString('he-IL'), text: `${label} (${delta > 0 ? '+' : ''}${delta} ₪)` }, ...child.history]
              }
            }
          };
        });
        setAdjModal({ open: false, type: 'bonus' });
      };

      const openDistributeModal = () => {
        const total = activeChild.bucket.currentAmount;
        const avail = +(total * 0.5).toFixed(2);
        const sav = +(total * 0.4).toFixed(2);
        const don = +(total - avail - sav).toFixed(2);
        setDistSplit({ available: avail, savings: sav, donation: don });
        setDistModalOpen(true);
      };

      const handleDistribute = (e) => {
        e.preventDefault();
        const total = activeChild.bucket.currentAmount;
        const sum = +(distSplit.available + distSplit.savings + distSplit.donation).toFixed(2);
        if (Math.abs(sum - total) > 0.05) return;

        setData((prev) => {
          const child = prev.children[activeChildId];
          const prevPrin = child.funds.savings.principal;
          const prevInt = child.funds.savings.interest;
          const prevTotalSav = prevPrin + prevInt;
          const weeklyInterest = +(prevTotalSav * 0.08).toFixed(2);

          return {
            ...prev,
            children: {
              ...prev.children,
              [activeChildId]: {
                ...child,
                bucket: { baseAmount: 25, currentAmount: 25, adjustments: [] },
                funds: {
                  ...child.funds,
                  available: { balance: +(child.funds.available.balance + distSplit.available).toFixed(2) },
                  savings: {
                    ...child.funds.savings,
                    principal: +(prevPrin + distSplit.savings).toFixed(2),
                    interest: +(prevInt + weeklyInterest).toFixed(2)
                  },
                  donation: {
                    ...child.funds.donation,
                    balance: +(child.funds.donation.balance + distSplit.donation).toFixed(2)
                  }
                },
                history: [
                  {
                    id: Date.now(),
                    date: new Date().toLocaleDateString('he-IL'),
                    text: `חלוקה שבועית: ${distSplit.available}₪ זמין, ${distSplit.savings}₪ חיסכון (+${weeklyInterest}₪ ריבית), ${distSplit.donation}₪ תרומה`
                  },
                  ...child.history
                ]
              }
            }
          };
        });
        setDistModalOpen(false);
      };

      const openWithdrawModal = (fundKey, maxAmount) => {
        setWithdrawModal({ open: true, fundKey, maxAmount });
        setWithdrawInput(fundKey === 'savings' && !isSavingsUnlocked ? String(maxAmount) : '');
        setWithdrawReason('');
        setWithdrawError('');
      };

      const handleConfirmWithdraw = (e) => {
        if (e) e.preventDefault();
        const { fundKey, maxAmount } = withdrawModal;
        const isLockedSavings = fundKey === 'savings' && !isSavingsUnlocked;
        const requested = isLockedSavings ? maxAmount : parseFloat(withdrawInput);

        if (isNaN(requested) || requested <= 0) {
          setWithdrawError('יש להזין סכום תקין גדול מ-0.');
          return;
        }
        if (requested > maxAmount + 0.001) {
          setWithdrawError(`הסכום חורג מהיתרה הקיימת (${fmt(maxAmount)} ₪).`);
          return;
        }

        const note = withdrawReason.trim() ? ` (${withdrawReason.trim()})` : '';

        setData((prev) => {
          const child = prev.children[activeChildId];
          const updatedFunds = { ...child.funds };
          let logText = '';

          if (fundKey === 'available') {
            const remaining = Math.max(0, +(child.funds.available.balance - requested).toFixed(2));
            logText = `משיכה מהארנק הזמין: ${fmt(requested)} ₪${note} (נותר: ${fmt(remaining)} ₪)`;
            updatedFunds.available = { balance: remaining };
          } else if (fundKey === 'savings') {
            if (isSavingsUnlocked) {
              const total = child.funds.savings.principal + child.funds.savings.interest;
              const remainingTotal = Math.max(0, +(total - requested).toFixed(2));
              const ratio = total > 0 ? remainingTotal / total : 0;
              logText = `משיכה מקופת החלומות: ${fmt(requested)} ₪${note} (נותר: ${fmt(remainingTotal)} ₪)`;
              updatedFunds.savings = {
                ...child.funds.savings,
                principal: +(child.funds.savings.principal * ratio).toFixed(2),
                interest: +(child.funds.savings.interest * ratio).toFixed(2),
                unlockDate: remainingTotal === 0 ? Date.now() + 90 * 24 * 60 * 60 * 1000 : child.funds.savings.unlockDate
              };
            } else {
              logText = `שבירת חיסכון מוקדמת: נמשכו ${fmt(principal)} ₪ קרן (בוטלו ${fmt(interest)} ₪ ריבית)`;
              updatedFunds.savings = { principal: 0, interest: 0, unlockDate: Date.now() + 90 * 24 * 60 * 60 * 1000 };
            }
          } else if (fundKey === 'donation') {
            const remaining = Math.max(0, +(child.funds.donation.balance - requested).toFixed(2));
            logText = `משיכה מקופת תרומה: ${fmt(requested)} ₪${note} (נותר: ${fmt(remaining)} ₪)`;
            updatedFunds.donation = {
              balance: remaining,
              unlockDate: remaining === 0 ? Date.now() + 90 * 24 * 60 * 60 * 1000 : child.funds.donation.unlockDate
            };
          }

          return {
            ...prev,
            children: {
              ...prev.children,
              [activeChildId]: {
                ...child,
                funds: updatedFunds,
                history: [{ id: Date.now(), date: new Date().toLocaleDateString('he-IL'), text: logText }, ...child.history]
              }
            }
          };
        });
        setWithdrawModal({ open: false, fundKey: 'available', maxAmount: 0 });
      };

      const fmt = (n) => Number(n || 0).toLocaleString('he-IL', { maximumFractionDigits: 2 });

      return (
        <div className="min-h-screen pb-12">
          <header className="bg-white border-b border-slate-200 sticky top-0 z-20 shadow-sm">
            <div className="max-w-4xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-2">
              <div className="flex items-center gap-2.5">
                <div className="w-10 h-10 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-bold text-xl shadow">₪</div>
                <div>
                  <h1 className="font-bold text-lg text-slate-900 leading-tight">הבנק המשפחתי</h1>
                  <p className="text-xs text-slate-500">אביב ושקד • ניהול כסף כיס</p>
                </div>
              </div>

              <div className="flex items-center gap-2">
                <button
                  onClick={() => { setSyncInput(familyCode); setShowSyncModal(true); }}
                  className={`px-3 py-1.5 rounded-full text-xs font-medium flex items-center gap-1.5 border ${
                    cloudConnected ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-amber-50 text-amber-700 border-amber-200'
                  }`}
                >
                  <span className={`w-2 h-2 rounded-full ${cloudConnected ? 'bg-emerald-500' : 'bg-amber-500'}`}></span>
                  {cloudConnected ? 'מסונכרן בענן' : 'מצב מקומי'}
                </button>

                {isParentMode ? (
                  <>
                    <button
                      onClick={() => { setResetStreetInput(''); setResetErrorMsg(''); setShowSettingsModal(true); }}
                      className="p-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 transition"
                      title="הגדרות הורים"
                    >
                      ⚙️
                    </button>
                    <button
                      onClick={() => setIsParentMode(false)}
                      className="px-3 py-1.5 rounded-xl bg-rose-100 hover:bg-rose-200 text-rose-800 text-xs font-semibold transition"
                    >
                      יציאה ממצב הורים
                    </button>
                  </>
                ) : (
                  <button
                    onClick={() => { setPinInput(''); setPinError(false); setShowPinModal(true); }}
                    className="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-white text-xs font-semibold transition"
                  >
                    🔒 כניסת הורים
                  </button>
                )}
              </div>
            </div>
          </header>

          <section className="max-w-4xl mx-auto px-4 mt-5">
            <div className="bg-white p-1.5 rounded-2xl border border-slate-200 shadow-sm grid grid-cols-2 gap-2">
              {['aviv', 'shaked'].map((cid) => {
                const c = data.children[cid];
                const isSelected = activeChildId === cid;
                return (
                  <button
                    key={cid}
                    onClick={() => handleSelectChild(cid)}
                    className={`py-2.5 px-4 rounded-xl font-bold text-base transition flex items-center justify-center gap-2 ${
                      isSelected ? 'bg-indigo-600 text-white shadow' : 'text-slate-600 hover:bg-slate-100'
                    }`}
                  >
                    <span>{c.name}</span>
                  </button>
                );
              })}
            </div>
          </section>

          <main className="max-w-4xl mx-auto px-4 mt-5 space-y-6">
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              {/* Square 1: Weekly Bucket */}
              <div className="bg-white rounded-2xl border-2 border-indigo-100 p-5 shadow-sm flex flex-col justify-between">
                <div>
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-xs font-bold uppercase tracking-wide text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-lg">
                      1. קופת השבוע הנוכחי
                    </span>
                    <span className="text-xs text-slate-400">בסיס: {activeChild.bucket.baseAmount} ₪</span>
                  </div>
                  <div className="text-4xl font-extrabold text-slate-900 my-2">
                    {fmt(activeChild.bucket.currentAmount)} <span className="text-xl font-bold text-slate-500">₪</span>
                  </div>
                  {activeChild.bucket.adjustments.length > 0 && (
                    <div className="mt-2 space-y-1 max-h-20 overflow-y-auto text-xs">
                      {activeChild.bucket.adjustments.map((adj) => (
                        <div key={adj.id} className="flex justify-between bg-slate-50 px-2 py-1 rounded">
                          <span className="text-slate-600">{adj.reason}</span>
                          <span className={adj.delta >= 0 ? 'text-emerald-600 font-bold' : 'text-rose-600 font-bold'}>
                            {adj.delta > 0 ? `+${adj.delta}` : adj.delta} ₪
                          </span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                {isParentMode ? (
                  <div className="mt-4 pt-3 border-t border-slate-100 space-y-2">
                    <div className="grid grid-cols-2 gap-2">
                      <button
                        onClick={() => openAdjustmentModal('bonus')}
                        className="py-2 px-3 rounded-xl bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-semibold text-xs transition"
                      >
                        + בונוס
                      </button>
                      <button
                        onClick={() => openAdjustmentModal('deduction')}
                        className="py-2 px-3 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-700 font-semibold text-xs transition"
                      >
                        - הפחתה
                      </button>
                    </div>
                    <button
                      onClick={openDistributeModal}
                      className="w-full py-2.5 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm shadow transition"
                    >
                      חלק לקופות השבוע ←
                    </button>
                  </div>
                ) : (
                  <p className="mt-4 text-xs text-slate-400">מחכה לחלוקה השבועית של אבא ואמא</p>
                )}
              </div>

              {/* Square 2: Available Wallet */}
              <div className="bg-white rounded-2xl border-2 border-emerald-100 p-5 shadow-sm flex flex-col justify-between">
                <div>
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-xs font-bold text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-lg">
                      2. זמין מיידית (50%)
                    </span>
                    <span className="text-xs text-emerald-600 font-medium">נזיל בכל רגע</span>
                  </div>
                  <div className="text-4xl font-extrabold text-emerald-700 my-2">
                    {fmt(activeChild.funds.available.balance)} <span className="text-xl font-bold">₪</span>
                  </div>
                  <p className="text-xs text-slate-500">כסף חופשי לבזבוזים קטנים וקניות שוטפות.</p>
                </div>

                {isParentMode && (
                  <div className="mt-4 pt-3 border-t border-slate-100">
                    <button
                      disabled={activeChild.funds.available.balance <= 0}
                      onClick={() => openWithdrawModal('available', activeChild.funds.available.balance)}
                      className="w-full py-2 px-3 rounded-xl bg-emerald-600 disabled:bg-slate-200 disabled:text-slate-400 hover:bg-emerald-700 text-white font-semibold text-xs transition"
                    >
                      משיכה מהארנק
                    </button>
                  </div>
                )}
              </div>

              {/* Square 3: Savings Fund */}
              <div className="bg-white rounded-2xl border-2 border-blue-100 p-5 shadow-sm flex flex-col justify-between">
                <div>
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-xs font-bold text-blue-700 bg-blue-50 px-2.5 py-1 rounded-lg">
                      3. קופת החלומות (40%)
                    </span>
                    <span className="text-xs text-blue-600 font-medium">
                      {isSavingsUnlocked ? '🔓 פתוח למשיכה' : `🔒 עוד ${savingsDaysLeft} ימים`}
                    </span>
                  </div>

                  <div className="flex items-center justify-between gap-4 my-2">
                    <div>
                      <div className="text-4xl font-extrabold text-blue-700">
                        {fmt(totalSavingsBalance)} <span className="text-xl font-bold">₪</span>
                      </div>
                      <div className="mt-2 space-y-0.5 text-xs">
                        <div className="text-slate-600">קרן שהופקדה: <strong className="text-blue-700">{fmt(principal)} ₪</strong></div>
                        <div className="text-slate-600">רווח מריבית (8%): <strong className="text-amber-600">+{fmt(interest)} ₪</strong></div>
                      </div>
                    </div>

                    <div className="flex flex-col items-center">
                      <div className="w-6 h-20 bg-slate-100 rounded-lg overflow-hidden flex flex-col-reverse border border-slate-200">
                        {totalSavingsBalance > 0 && (
                          <>
                            <div
                              style={{ height: `${(principal / totalSavingsBalance) * 100}%` }}
                              className="bg-blue-500 w-full transition-all"
                              title={`קרן: ${fmt(principal)} ₪`}
                            />
                            <div
                              style={{ height: `${(interest / totalSavingsBalance) * 100}%` }}
                              className="bg-amber-400 w-full transition-all"
                              title={`ריבית: ${fmt(interest)} ₪`}
                            />
                          </>
                        )}
                      </div>
                      <span className="text-[10px] text-slate-400 mt-1">קרן/ריבית</span>
                    </div>
                  </div>
                </div>

                {isParentMode ? (
                  <div className="mt-4 pt-3 border-t border-slate-100">
                    <button
                      disabled={totalSavingsBalance <= 0}
                      onClick={() => openWithdrawModal('savings', totalSavingsBalance)}
                      className={`w-full py-2 px-3 rounded-xl font-semibold text-xs transition ${
                        totalSavingsBalance <= 0
                          ? 'bg-slate-200 text-slate-400'
                          : isSavingsUnlocked
                          ? 'bg-blue-600 hover:bg-blue-700 text-white'
                          : 'bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-200'
                      }`}
                    >
                      {isSavingsUnlocked ? 'משיכה מקופת החלומות' : 'שבירת חיסכון מוקדמת (איבוד ריבית)'}
                    </button>
                  </div>
                ) : (
                  <p className="mt-3 text-[11px] text-slate-400">ריבית דריבית 8% בכל חלוקה שבועית. שבירה מוקדמת מאפסת את הריבית.</p>
                )}
              </div>

              {/* Square 4: Good Deeds / Donation */}
              <div className="bg-white rounded-2xl border-2 border-purple-100 p-5 shadow-sm flex flex-col justify-between">
                <div>
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-xs font-bold text-purple-700 bg-purple-50 px-2.5 py-1 rounded-lg">
                      4. מעשים טובים / תרומה (10%)
                    </span>
                    <span className="text-xs text-purple-600 font-medium">
                      {isDonationUnlocked ? '🔓 מוכן לתרומה' : `עוד ${donationDaysLeft} ימים`}
                    </span>
                  </div>
                  <div className="text-4xl font-extrabold text-purple-700 my-2">
                    {fmt(activeChild.funds.donation.balance)} <span className="text-xl font-bold">₪</span>
                  </div>
                  <p className="text-xs text-slate-500">נאסף בצד לבחירת יעד תרומה משותף פעם ברבעון.</p>
                </div>

                {isParentMode && (
                  <div className="mt-4 pt-3 border-t border-slate-100">
                    <button
                      disabled={activeChild.funds.donation.balance <= 0}
                      onClick={() => openWithdrawModal('donation', activeChild.funds.donation.balance)}
                      className="w-full py-2 px-3 rounded-xl bg-purple-600 disabled:bg-slate-200 disabled:text-slate-400 hover:bg-purple-700 text-white font-semibold text-xs transition"
                    >
                      משיכה לביצוע תרומה
                    </button>
                  </div>
                )}
              </div>
            </div>

            {/* History Log */}
            <div className="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
              <h3 className="font-bold text-sm text-slate-700 mb-3">היסטוריית פעולות אחרונות ({activeChild.name})</h3>
              {activeChild.history.length === 0 ? (
                <p className="text-xs text-slate-400">עדיין לא נרשמו פעולות.</p>
              ) : (
                <div className="space-y-2 max-h-48 overflow-y-auto">
                  {activeChild.history.map((item) => (
                    <div key={item.id} className="flex items-center justify-between text-xs py-1.5 border-b border-slate-100 last:border-0">
                      <span className="text-slate-700">{item.text}</span>
                      <span className="text-slate-400 shrink-0 mr-2">{item.date}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </main>

          {/* PIN Modal */}
          {showPinModal && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
              <form onSubmit={handlePinSubmit} className="bg-white rounded-2xl p-6 max-w-xs w-full shadow-xl space-y-4">
                <h3 className="font-bold text-lg text-slate-900">כניסת הורים</h3>
                <input
                  type="password"
                  inputMode="numeric"
                  autoFocus
                  value={pinInput}
                  onChange={(e) => setPinInput(e.target.value)}
                  placeholder="הזן סיסמה"
                  className="w-full border border-slate-300 rounded-xl px-4 py-2.5 text-center text-lg tracking-widest"
                />
                {pinError && <p className="text-xs text-rose-600 text-center">סיסמה שגויה</p>}
                <div className="flex gap-2">
                  <button type="button" onClick={() => setShowPinModal(false)} className="flex-1 py-2 rounded-xl bg-slate-100 text-slate-700 text-sm font-semibold">ביטול</button>
                  <button type="submit" className="flex-1 py-2 rounded-xl bg-indigo-600 text-white text-sm font-semibold">כניסה</button>
                </div>
              </form>
            </div>
          )}

          {/* Sync Modal */}
          {showSyncModal && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
              <form onSubmit={handleSaveFamilyCode} className="bg-white rounded-2xl p-6 max-w-sm w-full shadow-xl space-y-4">
                <h3 className="font-bold text-lg text-slate-900">קוד סנכרון משפחתי</h3>
                <p className="text-xs text-slate-500">הזינו את אותו קוד בכל המכשירים בבית כדי לסנכרן נתונים בזמן אמת.</p>
                <input
                  type="text"
                  value={syncInput}
                  onChange={(e) => setSyncInput(e.target.value)}
                  className="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm text-left"
                  dir="ltr"
                />
                <div className="flex gap-2">
                  <button type="button" onClick={() => setShowSyncModal(false)} className="flex-1 py-2 rounded-xl bg-slate-100 text-slate-700 text-sm font-semibold">סגור</button>
                  <button type="submit" className="flex-1 py-2 rounded-xl bg-indigo-600 text-white text-sm font-semibold">שמור קוד</button>
                </div>
              </form>
            </div>
          )}

          {/* Settings Modal */}
          {showSettingsModal && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl p-6 max-w-md w-full shadow-xl space-y-5">
                <div className="flex items-center justify-between">
                  <h3 className="font-bold text-lg text-slate-900">⚙️ הגדרות הורים</h3>
                  <button onClick={() => setShowSettingsModal(false)} className="text-slate-400 hover:text-slate-600 text-lg">✕</button>
                </div>

                <form onSubmit={handleChangePin} className="space-y-2 border-b border-slate-100 pb-4">
                  <label className="block text-xs font-bold text-slate-700">שינוי סיסמת הורים</label>
                  <div className="flex gap-2">
                    <input
                      type="text"
                      inputMode="numeric"
                      value={newPinInput}
                      onChange={(e) => setNewPinInput(e.target.value)}
                      placeholder="סיסמה חדשה"
                      className="flex-1 border border-slate-300 rounded-xl px-3 py-2 text-sm"
                    />
                    <button type="submit" className="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-semibold">עדכן</button>
                  </div>
                  {pinSavedMsg && <p className="text-xs text-emerald-600 font-medium">הסיסמה עודכנה בהצלחה!</p>}
                </form>

                <form onSubmit={handleSecureReset} className="space-y-2">
                  <label className="block text-xs font-bold text-rose-700">איפוס מלא של כל הנתונים (אביב ושקד)</label>
                  <p className="text-xs text-slate-600">לאישור איפוס הקופות, ענו על שאלת האבטחה:<br/><strong>באיזה רחוב אמא ואבא גרו בתל אביב?</strong></p>
                  <input
                    type="text"
                    value={resetStreetInput}
                    onChange={(e) => { setResetStreetInput(e.target.value); setResetErrorMsg(''); }}
                    placeholder="הקלד את שם הרחוב..."
                    className="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm"
                  />
                  {resetErrorMsg && <p className="text-xs text-rose-600">{resetErrorMsg}</p>}
                  <button type="submit" className="w-full py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold">
                    אפס את כל הקופות
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* Bonus / Deduction Modal */}
          {adjModal.open && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
              <form onSubmit={handleAddAdjustment} className="bg-white rounded-2xl p-6 max-w-sm w-full shadow-xl space-y-4">
                <h3 className="font-bold text-lg text-slate-900">
                  {adjModal.type === 'bonus' ? 'הוספת בונוס' : 'הפחתה מהקופה השבועית'}
                </h3>
                <div>
                  <label className="block text-xs font-medium text-slate-600 mb-1">סכום (₪)</label>
                  <input
                    type="number"
                    step="0.5"
                    min="0.5"
                    value={adjAmount}
                    onChange={(e) => setAdjAmount(e.target.value)}
                    className="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm"
                  />
                </div>
                <div>
                  <label className="block text-xs font-medium text-slate-600 mb-1">סיבה</label>
                  <input
                    type="text"
                    value={adjReason}
                    onChange={(e) => setAdjReason(e.target.value)}
                    placeholder={adjModal.type === 'bonus' ? 'לדוגמה: עזרה בבית' : 'לדוגמה: התנהגות לא נעימה'}
                    className="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm"
                  />
                </div>
                <div className="flex gap-2">
                  <button type="button" onClick={() => setAdjModal({ open: false, type: 'bonus' })} className="flex-1 py-2 rounded-xl bg-slate-100 text-slate-700 text-sm font-semibold">ביטול</button>
                  <button type="submit" className="flex-1 py-2 rounded-xl bg-indigo-600 text-white text-sm font-semibold">אישור</button>
                </div>
              </form>
            </div>
          )}

          {/* Distribution Modal */}
          {distModalOpen && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
              <form onSubmit={handleDistribute} className="bg-white rounded-2xl p-6 max-w-sm w-full shadow-xl space-y-4">
                <h3 className="font-bold text-lg text-slate-900">חלוקה לקופות ({fmt(activeChild.bucket.currentAmount)} ₪)</h3>
                <div className="space-y-2 text-xs">
                  <div className="flex justify-between items-center">
                    <span>זמין מיידית:</span>
                    <input type="number" step="0.5" value={distSplit.available} onChange={(e) => setDistSplit({ ...distSplit, available: +e.target.value })} className="w-24 border rounded-lg px-2 py-1 text-left" />
                  </div>
                  <div className="flex justify-between items-center">
                    <span>קופת החלומות (+8% ריבית על היתרה):</span>
                    <input type="number" step="0.5" value={distSplit.savings} onChange={(e) => setDistSplit({ ...distSplit, savings: +e.target.value })} className="w-24 border rounded-lg px-2 py-1 text-left" />
                  </div>
                  <div className="flex justify-between items-center">
                    <span>מעשים טובים (תרומה):</span>
                    <input type="number" step="0.5" value={distSplit.donation} onChange={(e) => setDistSplit({ ...distSplit, donation: +e.target.value })} className="w-24 border rounded-lg px-2 py-1 text-left" />
                  </div>
                </div>
                <div className="flex gap-2">
                  <button type="button" onClick={() => setDistModalOpen(false)} className="flex-1 py-2 rounded-xl bg-slate-100 text-slate-700 text-sm font-semibold">ביטול</button>
                  <button type="submit" className="flex-1 py-2 rounded-xl bg-indigo-600 text-white text-sm font-semibold">בצע חלוקה</button>
                </div>
              </form>
            </div>
          )}

          {/* Withdraw Modal (Custom Amount) */}
          {withdrawModal.open && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
              <form onSubmit={handleConfirmWithdraw} className="bg-white rounded-2xl p-6 max-w-sm w-full shadow-xl space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="font-bold text-lg text-slate-900">משיכת כסף</h3>
                  <span className="text-xs text-slate-500">יתרה זמינה: <strong>{fmt(withdrawModal.maxAmount)} ₪</strong></span>
                </div>

                {withdrawModal.fundKey === 'savings' && !isSavingsUnlocked ? (
                  <p className="text-xs text-amber-800 bg-amber-50 p-3 rounded-xl">
                    החיסכון עדיין נעול. שבירת חיסכון תחזיר את כל הקרן (<strong>{fmt(principal)} ₪</strong>) ותבטל את הריבית (<strong>{fmt(interest)} ₪</strong>).
                  </p>
                ) : (
                  <>
                    <div>
                      <label className="block text-xs font-medium text-slate-600 mb-1">סכום למשיכה (₪)</label>
                      <div className="flex gap-2">
                        <input
                          type="number"
                          step="0.5"
                          min="0.5"
                          max={withdrawModal.maxAmount}
                          autoFocus
                          required
                          value={withdrawInput}
                          onChange={(e) => { setWithdrawInput(e.target.value); setWithdrawError(''); }}
                          placeholder="הזן סכום..."
                          className="flex-1 border border-slate-300 rounded-xl px-3 py-2 text-base font-bold"
                        />
                        <button
                          type="button"
                          onClick={() => { setWithdrawInput(String(withdrawModal.maxAmount)); setWithdrawError(''); }}
                          className="px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold"
                        >
                          הכל
                        </button>
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-medium text-slate-600 mb-1">מטרת המשיכה (אופציונלי)</label>
                      <input
                        type="text"
                        value={withdrawReason}
                        onChange={(e) => setWithdrawReason(e.target.value)}
                        placeholder="לדוגמה: גלידה, קלפים, תרומה..."
                        className="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm"
                      />
                    </div>
                  </>
                )}

                {withdrawError && <p className="text-xs text-rose-600">{withdrawError}</p>}

                <div className="flex gap-2">
                  <button
                    type="button"
                    onClick={() => setWithdrawModal({ open: false, fundKey: 'available', maxAmount: 0 })}
                    className="flex-1 py-2 rounded-xl bg-slate-100 text-slate-700 text-sm font-semibold"
                  >
                    ביטול
                  </button>
                  <button type="submit" className="flex-1 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold">
                    אשר משיכה
                  </button>
                </div>
              </form>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
